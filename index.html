<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Umanoidi - Il Futuro della Robotica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://cdn.fontsource.dev/css/@fontsource/inter/400,500,600,700,800,900.css" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #0ea5e9;
  --primary-dark: #0284c7;
  --accent: #6366f1;
  --accent-light: #818cf8;
  --dark: #0f172a;
  --dark-2: #1e293b;
  --dark-3: #334155;
  --light: #f8fafc;
  --gray: #94a3b8;
  --gray-light: #e2e8f0;
  --gradient-1: linear-gradient(135deg, #0ea5e9, #6366f1);
  --gradient-2: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  --shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
  --shadow-sm: 0 10px 25px -5px rgba(0,0,0,0.1);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--dark);
  color: var(--light);
  overflow-x: hidden;
  line-height: 1.7;
}

/* NAVBAR */
.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  padding: 1rem 2rem;
  display: flex; align-items: center; justify-content: space-between;
  transition: all 0.4s ease;
  background: transparent;
}
.navbar.scrolled {
  background: rgba(15,23,42,0.95);
  backdrop-filter: blur(20px);
  box-shadow: 0 4px 30px rgba(0,0,0,0.3);
  padding: 0.7rem 2rem;
}
.nav-logo {
  font-size: 1.5rem; font-weight: 800;
  background: var(--gradient-1);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-decoration: none;
  display: flex; align-items: center; gap: 0.5rem;
}
.nav-logo svg { width: 32px; height: 32px; }
.nav-links { display: flex; gap: 2rem; list-style: none; align-items: center; }
.nav-links a {
  color: var(--gray); text-decoration: none; font-weight: 500;
  font-size: 0.9rem; transition: color 0.3s; position: relative;
}
.nav-links a::after {
  content: ''; position: absolute; bottom: -4px; left: 0;
  width: 0; height: 2px; background: var(--gradient-1);
  transition: width 0.3s;
}
.nav-links a:hover { color: var(--light); }
.nav-links a:hover::after { width: 100%; }
.nav-cta {
  background: var(--gradient-1); color: #fff; padding: 0.6rem 1.5rem;
  border-radius: 50px; font-weight: 600; font-size: 0.85rem;
  text-decoration: none; transition: transform 0.3s, box-shadow 0.3s;
}
.nav-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(14,165,233,0.4); }
.nav-cta::after { display: none !important; }

.hamburger {
  display: none; flex-direction: column; gap: 5px; cursor: pointer;
  background: none; border: none; padding: 5px;
}
.hamburger span {
  width: 25px; height: 2px; background: var(--light);
  transition: all 0.3s; border-radius: 2px;
}
.hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
.hamburger.active span:nth-child(2) { opacity: 0; }
.hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

/* HERO */
.hero {
  min-height: 100vh; display: flex; align-items: center;
  position: relative; overflow: hidden;
  padding: 8rem 2rem 4rem;
}
.hero-bg {
  position: absolute; inset: 0; z-index: 0;
}
.hero-bg img {
  width: 100%; height: 100%; object-fit: cover; opacity: 0.25;
  filter: blur(2px);
}
.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0.7) 50%, rgba(15,23,42,0.9) 100%);
}
.hero-particles {
  position: absolute; inset: 0; z-index: 1; overflow: hidden;
}
.particle {
  position: absolute; border-radius: 50%;
  background: var(--primary); opacity: 0.15;
  animation: floatParticle 20s infinite ease-in-out;
}
@keyframes floatParticle {
  0%, 100% { transform: translateY(0) translateX(0); }
  25% { transform: translateY(-80px) translateX(30px); }
  50% { transform: translateY(-40px) translateX(-20px); }
  75% { transform: translateY(-100px) translateX(10px); }
}
.hero-content {
  position: relative; z-index: 2;
  max-width: 1200px; margin: 0 auto; width: 100%;
  display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center;
}
.hero-text { max-width: 600px; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: rgba(14,165,233,0.1); border: 1px solid rgba(14,165,233,0.3);
  padding: 0.5rem 1rem; border-radius: 50px; font-size: 0.8rem;
  color: var(--primary); font-weight: 600; margin-bottom: 1.5rem;
}
.hero-badge .dot {
  width: 8px; height: 8px; background: var(--primary);
  border-radius: 50%; animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.5); }
}
.hero h1 {
  font-size: clamp(2.5rem, 5vw, 4.5rem); font-weight: 900;
  line-height: 1.1; margin-bottom: 1.5rem;
}
.hero h1 .gradient-text {
  background: var(--gradient-1);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.hero-description {
  font-size: 1.15rem; color: var(--gray); margin-bottom: 2rem;
  max-width: 500px;
}
.hero-buttons { display: flex; gap: 1rem; flex-wrap: wrap; }
.btn-primary {
  background: var(--gradient-1); color: #fff; padding: 1rem 2rem;
  border-radius: 50px; font-weight: 700; font-size: 1rem;
  text-decoration: none; transition: all 0.3s; border: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 0.5rem;
}
.btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(14,165,233,0.4); }
.btn-secondary {
  background: transparent; color: var(--light); padding: 1rem 2rem;
  border-radius: 50px; font-weight: 600; font-size: 1rem;
  text-decoration: none; transition: all 0.3s; border: 2px solid var(--dark-3);
  display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer;
}
.btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
.hero-stats {
  display: flex; gap: 3rem; margin-top: 3rem;
  padding-top: 2rem; border-top: 1px solid var(--dark-3);
}
.stat-item h3 {
  font-size: 2rem; font-weight: 800;
  background: var(--gradient-1);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.stat-item p { font-size: 0.85rem; color: var(--gray); margin-top: 0.25rem; }

.hero-visual {
  position: relative; display: flex; justify-content: center; align-items: center;
}
.hero-image-wrapper {
  position: relative; width: 100%; max-width: 500px;
}
.hero-image-wrapper img {
  width: 100%; border-radius: 24px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(14,165,233,0.2);
}
.hero-image-glow {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 80%; height: 80%;
  background: radial-gradient(circle, rgba(14,165,233,0.3) 0%, transparent 70%);
  filter: blur(60px); z-index: -1;
  animation: glowPulse 4s infinite ease-in-out;
}
@keyframes glowPulse {
  0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
}
.floating-card {
  position: absolute; background: rgba(30,41,59,0.9);
  backdrop-filter: blur(20px); border: 1px solid rgba(14,165,233,0.2);
  border-radius: 16px; padding: 1rem 1.25rem;
  animation: floatCard 6s infinite ease-in-out;
}
.floating-card-1 { top: 10%; right: -10%; animation-delay: 0s; }
.floating-card-2 { bottom: 15%; left: -10%; animation-delay: 2s; }
@keyframes floatCard {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}
.floating-card .card-icon {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--gradient-1); display: flex; align-items: center;
  justify-content: center; margin-bottom: 0.5rem; font-size: 1.2rem;
}
.floating-card .card-label { font-size: 0.7rem; color: var(--gray); }
.floating-card .card-value { font-size: 0.95rem; font-weight: 700; }

/* SECTIONS COMMON */
section { padding: 6rem 2rem; }
.section-container { max-width: 1200px; margin: 0 auto; }
.section-header { text-align: center; margin-bottom: 4rem; }
.section-label {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: rgba(14,165,233,0.1); border: 1px solid rgba(14,165,233,0.2);
  padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.8rem;
  color: var(--primary); font-weight: 600; margin-bottom: 1rem;
  text-transform: uppercase; letter-spacing: 1px;
}
.section-header h2 {
  font-size: clamp(2rem, 4vw, 3rem); font-weight: 800;
  margin-bottom: 1rem;
}
.section-header p {
  color: var(--gray); font-size: 1.1rem; max-width: 600px; margin: 0 auto;
}

/* ABOUT */
.about { background: var(--dark); }
.about-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center;
}
.about-image { position: relative; }
.about-image img {
  width: 100%; border-radius: 20px;
  box-shadow: var(--shadow);
}
.about-image-accent {
  position: absolute; bottom: -20px; right: -20px;
  width: 200px; height: 200px; border-radius: 20px;
  background: var(--gradient-1); opacity: 0.2; z-index: -1;
}
.about-content h3 {
  font-size: 1.8rem; font-weight: 700; margin-bottom: 1.5rem;
}
.about-content p { color: var(--gray); margin-bottom: 1.5rem; font-size: 1.05rem; }
.about-features { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; }
.about-feature {
  display: flex; align-items: flex-start; gap: 1rem;
  padding: 1rem; border-radius: 12px;
  background: var(--dark-2); border: 1px solid var(--dark-3);
  transition: all 0.3s;
}
.about-feature:hover {
  border-color: var(--primary); transform: translateX(5px);
}
.about-feature-icon {
  width: 44px; height: 44px; min-width: 44px; border-radius: 10px;
  background: var(--gradient-1); display: flex; align-items: center;
  justify-content: center; font-size: 1.2rem;
}
.about-feature h4 { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; }
.about-feature p { font-size: 0.85rem; color: var(--gray); margin: 0; }

/* TIMELINE */
.timeline-section { background: var(--dark-2); }
.timeline {
  position: relative; max-width: 900px; margin: 0 auto;
}
.timeline::before {
  content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
  width: 2px; background: var(--gradient-1); transform: translateX(-50%);
}
.timeline-item {
  position: relative; padding: 2rem 0;
  display: flex; align-items: center;
}
.timeline-item:nth-child(odd) { justify-content: flex-start; padding-right: calc(50% + 2rem); }
.timeline-item:nth-child(even) { justify-content: flex-end; padding-left: calc(50% + 2rem); }
.timeline-dot {
  position: absolute; left: 50%; transform: translateX(-50%);
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--gradient-1); border: 4px solid var(--dark-2);
  z-index: 2;
}
.timeline-card {
  background: var(--dark); border: 1px solid var(--dark-3);
  border-radius: 16px; padding: 1.5rem; width: 100%;
  transition: all 0.3s;
}
.timeline-card:hover {
  border-color: var(--primary); transform: translateY(-5px);
  box-shadow: var(--shadow-sm);
}
.timeline-year {
  font-size: 0.8rem; font-weight: 700; color: var(--primary);
  margin-bottom: 0.5rem;
}
.timeline-card h4 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
.timeline-card p { font-size: 0.9rem; color: var(--gray); }

/* TECHNOLOGIES */
.technologies { background: var(--dark); }
.tech-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;
}
.tech-card {
  background: var(--dark-2); border: 1px solid var(--dark-3);
  border-radius: 20px; padding: 2rem; transition: all 0.4s;
  position: relative; overflow: hidden;
}
.tech-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 3px; background: var(--gradient-1);
  transform: scaleX(0); transition: transform 0.4s;
  transform-origin: left;
}
.tech-card:hover::before { transform: scaleX(1); }
.tech-card:hover {
  border-color: var(--primary); transform: translateY(-8px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}
.tech-icon {
  width: 60px; height: 60px; border-radius: 16px;
  background: rgba(14,165,233,0.1); display: flex; align-items: center;
  justify-content: center; font-size: 1.8rem; margin-bottom: 1.25rem;
}
.tech-card h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.75rem; }
.tech-card p { font-size: 0.9rem; color: var(--gray); line-height: 1.6; }
.tech-tag {
  display: inline-block; margin-top: 1rem; padding: 0.3rem 0.75rem;
  background: rgba(99,102,241,0.1); color: var(--accent-light);
  border-radius: 50px; font-size: 0.75rem; font-weight: 600;
}

/* APPLICATIONS */
.applications { background: var(--dark-2); }
.app-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;
}
.app-card {
  background: var(--dark); border: 1px solid var(--dark-3);
  border-radius: 20px; overflow: hidden; transition: all 0.4s;
}
.app-card:hover {
  border-color: var(--primary); transform: translateY(-5px);
  box-shadow: var(--shadow);
}
.app-card-image {
  height: 200px; overflow: hidden; position: relative;
}
.app-card-image img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.5s;
}
.app-card:hover .app-card-image img { transform: scale(1.05); }
.app-card-image .app-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(15,23,42,0.8), transparent);
}
.app-card-body { padding: 1.5rem; }
.app-card-body h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.75rem; }
.app-card-body p { font-size: 0.9rem; color: var(--gray); margin-bottom: 1rem; }
.app-card-body .app-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.app-tag {
  padding: 0.25rem 0.6rem; background: rgba(14,165,233,0.1);
  color: var(--primary); border-radius: 6px; font-size: 0.7rem; font-weight: 600;
}

/* STATS */
.stats-section {
  background: var(--gradient-1); position: relative;
  overflow: hidden;
}
.stats-section::before {
  content: ''; position: absolute; inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}
.stats-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 2rem;
  position: relative; z-index: 1;
}
.stat-card { text-align: center; }
.stat-card .stat-number {
  font-size: 3rem; font-weight: 900; color: #fff;
}
.stat-card .stat-label {
  font-size: 0.9rem; color: rgba(255,255,255,0.8); margin-top: 0.5rem;
}

/* ETHICS */
.ethics { background: var(--dark); }
.ethics-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;
}
.ethics-card {
  background: var(--dark-2); border: 1px solid var(--dark-3);
  border-radius: 16px; padding: 2rem; text-align: center;
  transition: all 0.3s;
}
.ethics-card:hover {
  border-color: var(--accent); transform: translateY(-5px);
}
.ethics-icon {
  font-size: 2.5rem; margin-bottom: 1rem;
}
.ethics-card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.75rem; }
.ethics-card p { font-size: 0.9rem; color: var(--gray); }

/* FAQ */
.faq-section { background: var(--dark-2); }
.faq-list { max-width: 800px; margin: 0 auto; }
.faq-item {
  background: var(--dark); border: 1px solid var(--dark-3);
  border-radius: 16px; margin-bottom: 1rem; overflow: hidden;
  transition: all 0.3s;
}
.faq-item.active { border-color: var(--primary); }
.faq-question {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.25rem 1.5rem; cursor: pointer;
  background: none; border: none; width: 100%;
  color: var(--light); font-size: 1rem; font-weight: 600;
  text-align: left; font-family: inherit;
  transition: color 0.3s;
}
.faq-question:hover { color: var(--primary); }
.faq-icon {
  width: 32px; height: 32px; min-width: 32px; border-radius: 8px;
  background: rgba(14,165,233,0.1); display: flex; align-items: center;
  justify-content: center; transition: all 0.3s; font-size: 1.2rem;
}
.faq-item.active .faq-icon {
  background: var(--gradient-1); transform: rotate(45deg);
}
.faq-answer {
  max-height: 0; overflow: hidden; transition: max-height 0.4s ease;
}
.faq-answer-inner {
  padding: 0 1.5rem 1.5rem; color: var(--gray); font-size: 0.95rem;
  line-height: 1.7;
}

/* CTA */
.cta-section {
  background: var(--dark);
  padding: 6rem 2rem;
}
.cta-box {
  max-width: 800px; margin: 0 auto; text-align: center;
  background: var(--dark-2); border: 1px solid var(--dark-3);
  border-radius: 32px; padding: 4rem 3rem;
  position: relative; overflow: hidden;
}
.cta-box::before {
  content: ''; position: absolute; top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: conic-gradient(from 0deg, transparent, var(--primary), transparent, var(--accent), transparent);
  animation: rotateBorder 8s linear infinite;
  opacity: 0.1;
}
@keyframes rotateBorder {
  to { transform: rotate(360deg); }
}
.cta-box h2 {
  font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem;
  position: relative;
}
.cta-box p {
  color: var(--gray); font-size: 1.1rem; margin-bottom: 2rem;
  position: relative;
}
.cta-box .btn-primary { position: relative; }

/* FOOTER */
footer {
  background: var(--dark-2); border-top: 1px solid var(--dark-3);
  padding: 4rem 2rem 2rem;
}
.footer-grid {
  max-width: 1200px; margin: 0 auto;
  display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 3rem;
}
.footer-brand h3 {
  font-size: 1.5rem; font-weight: 800;
  background: var(--gradient-1);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 1rem;
}
.footer-brand p { color: var(--gray); font-size: 0.9rem; max-width: 300px; }
.footer-col h4 {
  font-size: 0.9rem; font-weight: 700; margin-bottom: 1.25rem;
  text-transform: uppercase; letter-spacing: 1px;
}
.footer-col a {
  display: block; color: var(--gray); text-decoration: none;
  font-size: 0.9rem; padding: 0.3rem 0; transition: color 0.3s;
}
.footer-col a:hover { color: var(--primary); }
.footer-bottom {
  max-width: 1200px; margin: 3rem auto 0;
  padding-top: 2rem; border-top: 1px solid var(--dark-3);
  display: flex; justify-content: space-between; align-items: center;
  color: var(--gray); font-size: 0.85rem;
}
.footer-socials { display: flex; gap: 1rem; }
.footer-socials a {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--dark); border: 1px solid var(--dark-3);
  display: flex; align-items: center; justify-content: center;
  color: var(--gray); text-decoration: none; transition: all 0.3s;
  font-size: 1.1rem;
}
.footer-socials a:hover {
  border-color: var(--primary); color: var(--primary);
  transform: translateY(-3px);
}

/* SCROLL ANIMATIONS */
.reveal {
  opacity: 0; transform: translateY(40px);
  transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}
.reveal.visible {
  opacity: 1; transform: translateY(0);
}
.reveal-delay-1 { transition-delay: 0.1s; }
.reveal-delay-2 { transition-delay: 0.2s; }
.reveal-delay-3 { transition-delay: 0.3s; }
.reveal-delay-4 { transition-delay: 0.4s; }

/* SCROLL TO TOP */
.scroll-top {
  position: fixed; bottom: 2rem; right: 2rem;
  width: 48px; height: 48px; border-radius: 14px;
  background: var(--gradient-1); color: #fff;
  border: none; cursor: pointer; font-size: 1.2rem;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transform: translateY(20px);
  transition: all 0.3s; z-index: 999;
  box-shadow: 0 10px 30px rgba(14,165,233,0.3);
}
.scroll-top.visible { opacity: 1; transform: translateY(0); }
.scroll-top:hover { transform: translateY(-3px); }

/* RESPONSIVE */
@media (max-width: 1024px) {
